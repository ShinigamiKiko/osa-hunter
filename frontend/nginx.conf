server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Scans (trivy/grype/semgrep) and PDF export can send large payloads;
    # the backend allows up to 10mb on /api/export/pdf.
    client_max_body_size 16m;

    location / {
        auth_request /_auth;
        error_page 401 =302 /login.html;
        try_files $uri $uri/ /index.html;
    }

    # Keep the login page and its static dependencies public; protect the app shell.
    location = /login.html {
        try_files $uri =404;
    }

    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /_auth {
        internal;
        proxy_pass http://backend:3001/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host backend:3001;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Scans routinely run for several minutes (trivy --timeout 10m,
        # semgrep 5m). Keep well above the slowest backend timeout so the
        # client gets the real JSON result instead of an nginx 504 HTML page.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location /.well-known/ {
        return 204;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

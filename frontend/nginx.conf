server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Scans (trivy/grype/semgrep) and PDF export can send large payloads;
    # the backend allows up to 10mb on /api/export/pdf.
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Scans routinely run for several minutes (trivy --timeout 10m,
        # semgrep 5m). Keep well above the slowest backend timeout so the
        # client gets the real JSON result instead of an nginx 504 HTML page.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location /.well-known/ {
        return 204;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

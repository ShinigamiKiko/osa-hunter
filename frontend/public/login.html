<!doctype html>
<html lang="en" class="login-doc">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OSA Hunter — Sign In</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-radar">
      <div class="er-stage">
        <div class="er-rings-rotate">
          <div class="er-ring er-lg"></div>
          <div class="er-ring er-md"></div>
          <div class="er-ring er-sm"></div>
        </div>
        <div class="er-blip er-b1"></div>
        <div class="er-blip er-b2"></div>
        <div class="er-blip er-b3"></div>
        <div class="er-sweep-mask">
          <div class="er-rotor">
            <div class="er-beamglow"></div>
            <div class="er-needle"></div>
          </div>
        </div>
        <div class="er-crosshair"></div>
        <div class="er-frame"></div>
        <div class="er-wasp-wrap">
          <img class="er-wasp" src="/assets/osa.png" alt="OSA"/>
        </div>
      </div>
    </div>

    <div class="login-brand">
      <span class="login-brand-name">OSA HUNTER</span>
      <span class="login-brand-sub">Vulnerability Scanner</span>
    </div>

    <div class="login-form">
      <div class="login-field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username"/>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password"/>
      </div>
      <button class="login-btn" id="btnLogin" onclick="doLogin()">Sign In</button>
      <div class="login-err" id="errMsg" hidden></div>
    </div>

  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>

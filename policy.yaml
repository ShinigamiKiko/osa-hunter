version: 12

defaults:
  decision: allow
  on_gate_error: deny

rules:
  - id: toxic-repository
    action: deny
    when:
      toxic.found: yes
    detail: package is listed as a toxic repository

  - id: actively-exploited
    action: deny
    when:
      kev: yes
    detail: package contains a vulnerability listed in CISA KEV

  - id: critical
    action: deny
    when:
      counts.CRITICAL: ">= 1"
    detail: package contains a critical vulnerability

  - id: high-epss
    action: deny
    when:
      all:
        - counts.HIGH: ">= 1"
        - epssMax: ">= 0.5"
    detail: package contains a high vulnerability with EPSS >= 0.5

  - id: high
    action: warn
    when:
      counts.HIGH: ">= 1"
    detail: package contains a high vulnerability

  - id: public-poc
    action: warn
    when:
      pocCount: ">= 1"
    detail: package has a public proof of concept

# Manual name-based blocks/allows. Checked BEFORE any vulnerability scan, so
# these are hard firewall rules regardless of CVEs. Matching is supplier-
# agnostic: a bare name blocks that package in EVERY ecosystem (npm/pip/deb/
# ubuntu/rpm/apk/…). Forms accepted per entry:
#   left-pad                bare name  -> block everywhere, all versions
#   npm/left-pad            name in one ecosystem
#   npm/left-pad@1.3.0      exact version
#   "left-*"  /  "*/colors" glob masks (name and/or ecosystem)
exceptions:
  allow: []
  deny:
    - curl                # блок по имени во всех экосистемах (deb/ubuntu/rpm/apk/…)
    - cowsay              # демо: не установлен → чистый `apt install cowsay` даст 403
    # - left-pad
    # - event-stream
    # - "crossenv*"

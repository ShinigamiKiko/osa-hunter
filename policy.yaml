version: 8

defaults:
  decision: allow
  on_gate_error: deny

rules:
  # Блок 1: пакет с уязвимостью из каталога CISA KEV (активно эксплуатируется).
  - id: actively-exploited
    action: deny
    when:
      kev: yes
    detail: package contains a vulnerability listed in CISA KEV

  # Блок 2: пакет с любым CVE 2026 года.
  - id: any-2026-cve
    action: deny
    when:
      cves: "CVE-2026-*"
    detail: package carries a 2026 CVE

exceptions:
  allow: []
  deny: []

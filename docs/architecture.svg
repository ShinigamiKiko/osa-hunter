<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" width="900" height="470" role="img" aria-label="OSA Hunter architecture: package managers, the browser and API clients reach the backend through nginx; the gate checks each artifact against the policy before fetching it from the registry or Nexus">
  <title>OSA Hunter architecture</title>
  <defs>
    <clipPath id="clip"><rect width="900" height="470" rx="12"/></clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#13201c"/>
    </pattern>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#3b5a50"/>
    </marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)" font-family="'Courier New',monospace">
    <rect width="900" height="470" fill="#070d0b"/>
    <rect width="900" height="470" fill="url(#dots)"/>

    <text x="24" y="40" font-size="12" font-weight="700" fill="#5ef0c8" letter-spacing="3">ARCHITECTURE</text>
    <text x="876" y="40" text-anchor="end" font-size="10" fill="#557a6c" letter-spacing="1">one docker compose stack · self-hosted</text>

    <!-- Connections sit under the boxes, so packets show only in the gaps -->
    <g stroke="#2a4038" stroke-width="1.2" fill="none">
      <path d="M186 180 H226" marker-end="url(#head)"/>
      <path d="M186 263 H226" marker-end="url(#head)"/>
      <path d="M186 332 H226" marker-end="url(#head)"/>
      <path d="M272 180 H296" marker-end="url(#head)"/>
      <path d="M272 291 H296" marker-end="url(#head)"/>
      <path d="M448 180 H472" marker-end="url(#head)"/>
      <path d="M626 180 H698" marker-start="url(#head)" marker-end="url(#head)"/>
      <path d="M638 300 H698" marker-start="url(#head)" marker-end="url(#head)"/>
      <path d="M400 362 V376"/>
    </g>
    <text x="667" y="170" text-anchor="middle" font-size="8" fill="#5ef0c8">allowed</text>
    <text x="667" y="196" text-anchor="middle" font-size="8" fill="#557a6c">streamed</text>
    <text x="667" y="290" text-anchor="middle" font-size="8" fill="#00dcff">lookups</text>
    <text x="667" y="316" text-anchor="middle" font-size="8" fill="#557a6c">cached</text>

    <!-- Packets: artifact requests, UI and API calls, security data lookups -->
    <g filter="url(#glow)">
      <circle r="2.6" fill="#5ef0c8"><animateMotion dur="3.2s" repeatCount="indefinite" path="M186 180 H700"/></circle>
      <circle r="2.6" fill="#5ef0c8"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M186 180 H700"/></circle>
      <circle r="2.2" fill="#a78bfa"><animateMotion dur="1.4s" begin="0.4s" repeatCount="indefinite" path="M186 263 H228"/></circle>
      <circle r="2.2" fill="#38bdf8"><animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite" path="M186 332 H228"/></circle>
      <circle r="2.2" fill="#a78bfa"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M272 291 H298"/></circle>
      <circle r="2.2" fill="#00dcff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M638 300 H700"/></circle>
      <circle r="2.2" fill="#00dcff"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M700 300 H638"/></circle>
    </g>

    <!-- Clients -->
    <g>
      <rect x="20" y="108" width="166" height="114" rx="10" fill="#0c1510" stroke="#1a2d20"/>
      <text x="103" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="#5ef0c8" letter-spacing="1">PACKAGE MANAGERS</text>
      <g font-size="9" fill="#6f8f80" text-anchor="middle">
        <text x="103" y="152">npm · PyPI · Go</text>
        <text x="103" y="167">Maven · NuGet</text>
        <text x="103" y="182">Cargo · RubyGems</text>
        <text x="103" y="197">Composer</text>
        <text x="103" y="212">apt · apk · rpm</text>
      </g>
    </g>
    <g>
      <rect x="20" y="236" width="166" height="54" rx="10" fill="#0c1015" stroke="#1a2030"/>
      <text x="103" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="1">BROWSER</text>
      <text x="103" y="276" text-anchor="middle" font-size="9" fill="#737c94">scans · rules · proxy log</text>
    </g>
    <g>
      <rect x="20" y="304" width="166" height="56" rx="10" fill="#080f15" stroke="#0a2030"/>
      <text x="103" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">CI · API CLIENTS</text>
      <text x="103" y="344" text-anchor="middle" font-size="9" fill="#4a7896">X-Api-Key header</text>
    </g>

    <!-- OSA Hunter -->
    <rect x="212" y="74" width="440" height="380" rx="12" fill="rgba(94,240,200,0.015)" stroke="#1f3b33" stroke-dasharray="5 4"/>
    <text x="228" y="96" font-size="10" font-weight="700" fill="#5ef0c8" letter-spacing="2">OSA HUNTER</text>

    <rect x="228" y="108" width="44" height="252" rx="8" fill="#0b1218" stroke="#1d2c38"/>
    <text transform="translate(254 234) rotate(-90)" text-anchor="middle" font-size="9" fill="#6b8aa3" letter-spacing="1.5">FRONTEND · NGINX :3000</text>

    <rect x="286" y="108" width="352" height="254" rx="10" fill="#0a1110" stroke="#1a2b26"/>
    <text x="300" y="126" font-size="9" fill="#5d7a70" letter-spacing="1.5">BACKEND · EXPRESS :3001</text>

    <g>
      <rect x="298" y="138" width="150" height="84" rx="8" fill="#0c1510" stroke="#1a2d20"/>
      <text x="373" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#5ef0c8" letter-spacing="1">GATE</text>
      <g font-size="9" fill="#6f8f80" text-anchor="middle">
        <text x="373" y="177">/api/gate/&lt;repo&gt;</text>
        <text x="373" y="193">resolves package</text>
        <text x="373" y="209">and version</text>
      </g>
      <rect x="298" y="138" width="150" height="84" rx="8" fill="none" stroke="#5ef0c8" stroke-width="0" opacity="0">
        <animate attributeName="stroke-width" values="0;1.5;0" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="474" y="138" width="152" height="84" rx="8" fill="#10100c" stroke="#25200a"/>
      <text x="550" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#facc15" letter-spacing="1">POLICY</text>
      <g font-size="9" text-anchor="middle">
        <text x="550" y="177" fill="#5ec49a">allow · warn</text>
        <text x="550" y="193" fill="#e06060">deny → 403</text>
        <text x="550" y="209" fill="#e0954a">no data → 503</text>
      </g>
    </g>

    <g>
      <rect x="298" y="236" width="100" height="112" rx="8" fill="#0c1015" stroke="#1a2030"/>
      <text x="348" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="1">SCANS</text>
      <g font-size="9" fill="#737c94" text-anchor="middle">
        <text x="348" y="275">library</text>
        <text x="348" y="290">dependencies</text>
        <text x="348" y="305">Composer</text>
        <text x="348" y="320">image · OS</text>
        <text x="348" y="335">GitHub</text>
      </g>
    </g>
    <g>
      <rect x="411" y="236" width="100" height="112" rx="8" fill="#0d0c10" stroke="#20182a"/>
      <text x="461" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#e879f9" letter-spacing="1">TOOLS</text>
      <g font-size="9" fill="#8a6a98" text-anchor="middle">
        <text x="461" y="275">Trivy</text>
        <text x="461" y="290">Grype</text>
        <text x="461" y="305">Semgrep</text>
        <text x="461" y="320">Chromium</text>
        <text x="461" y="335">(PDF reports)</text>
      </g>
    </g>
    <g>
      <rect x="524" y="236" width="102" height="112" rx="8" fill="#080f15" stroke="#0a2030"/>
      <text x="575" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">ACCESS</text>
      <g font-size="9" fill="#4a7896" text-anchor="middle">
        <text x="575" y="275">sessions</text>
        <text x="575" y="290">admin · user</text>
        <text x="575" y="305">API keys</text>
      </g>
    </g>

    <g>
      <rect x="228" y="376" width="278" height="62" rx="8" fill="#0b0f18" stroke="#1a2236"/>
      <text x="242" y="397" font-size="10" font-weight="700" fill="#60a5fa" letter-spacing="1">POSTGRESQL 16</text>
      <text x="242" y="414" font-size="9" fill="#55709a">users · policy · scan history</text>
      <text x="242" y="429" font-size="9" fill="#55709a">proxy log · sessions · caches</text>
    </g>
    <g>
      <rect x="520" y="376" width="118" height="62" rx="8" fill="#0d0f12" stroke="#1e2228"/>
      <text x="534" y="397" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">METRICS</text>
      <text x="534" y="414" font-size="9" fill="#66727f">:9100/metrics</text>
      <text x="534" y="429" font-size="9" fill="#66727f">Prometheus</text>
    </g>

    <!-- Outside -->
    <g>
      <rect x="700" y="108" width="180" height="114" rx="10" fill="#120d08" stroke="#2a1c0c"/>
      <text x="790" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="#fb923c" letter-spacing="1">UPSTREAM</text>
      <g font-size="9" fill="#94704c" text-anchor="middle">
        <text x="790" y="152">registry.npmjs.org</text>
        <text x="790" y="167">pypi.org</text>
        <text x="790" y="182">proxy.golang.org</text>
        <text x="790" y="197">… or Nexus 3</text>
        <text x="790" y="212">proxy repositories</text>
      </g>
    </g>
    <g>
      <rect x="700" y="236" width="180" height="202" rx="10" fill="#071015" stroke="#0c2630"/>
      <text x="790" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#00dcff" letter-spacing="1">SECURITY DATA</text>
      <g font-size="9" fill="#4a90a2">
        <text x="728" y="282">OSV.dev</text>
        <text x="728" y="300">deps.dev</text>
        <text x="728" y="318">NVD · CVSS</text>
        <text x="728" y="336">FIRST · EPSS</text>
        <text x="728" y="354">CISA KEV</text>
        <text x="728" y="372">PoC-in-GitHub</text>
        <text x="728" y="390">toxic-repos</text>
        <text x="728" y="408">Packagist</text>
      </g>
      <g fill="#00dcff" opacity="0.5">
        <circle cx="718" cy="279" r="2"/><circle cx="718" cy="297" r="2"/><circle cx="718" cy="315" r="2"/>
        <circle cx="718" cy="333" r="2"/><circle cx="718" cy="351" r="2"/><circle cx="718" cy="369" r="2"/>
        <circle cx="718" cy="387" r="2"/><circle cx="718" cy="405" r="2"/>
      </g>
    </g>
  </g>
</svg>

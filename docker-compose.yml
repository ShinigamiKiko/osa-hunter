networks:
  osvguard:
    driver: bridge

services:

  postgres:
    image: postgres:16-alpine
    container_name: osvguard-postgres
    networks:
      - osvguard
    environment:
      POSTGRES_DB:       ${PGDATABASE:-osa}
      POSTGRES_USER:     ${PGUSER:-osa}
      POSTGRES_PASSWORD: ${PGPASSWORD:-osa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-osa} -d ${PGDATABASE:-osa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osvguard-backend
    networks:
      - osvguard
    ports:
       - "3001:3001"
       - "127.0.0.1:${METRICS_PORT:-9100}:9100"
    env_file:
      - .env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE:-osa}
      - PGUSER=${PGUSER:-osa}
      - PGPASSWORD=${PGPASSWORD:-osa}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OSA_POLICY_FILE=/app/policy.yaml
      - NEXUS_UPSTREAM=${NEXUS_UPSTREAM:-http://nexus:8081}
      - NODE_ENV=production
      - METRICS_PORT=9100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/app/.trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Optional: a Nexus alongside OSA. Off by default so NEXUS_UPSTREAM can point
  # at one on another host; start it with `docker compose --profile nexus up -d`.
  # For a separate machine use deploy/nexus/ instead.
  nexus:
    profiles: ["nexus"]
    image: sonatype/nexus3:3.70.1
    container_name: osvguard-nexus
    networks:
      - osvguard
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 150s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: osvguard-frontend
    networks:
      - osvguard
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trivy-cache:
  postgres-data:
  nexus-data:

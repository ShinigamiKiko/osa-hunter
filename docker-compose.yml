networks:
  osvguard:
    driver: bridge

services:

  postgres:
    image: postgres:16-alpine
    container_name: osvguard-postgres
    networks:
      - osvguard
    environment:
      POSTGRES_DB:       ${PGDATABASE:-osa}
      POSTGRES_USER:     ${PGUSER:-osa}
      POSTGRES_PASSWORD: ${PGPASSWORD:-osa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-osa} -d ${PGDATABASE:-osa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osvguard-backend
    networks:
      - osvguard
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE:-osa}
      - PGUSER=${PGUSER:-osa}
      - PGPASSWORD=${PGPASSWORD:-osa}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OSA_POLICY_FILE=/app/policy.yaml
      - NEXUS_UPSTREAM=${NEXUS_UPSTREAM:-http://nexus:8081}
      - OSA_NEXUS_REPOSITORIES=${OSA_NEXUS_REPOSITORIES:-{"npm-proxy":"npm","pypi-proxy":"PyPI","go-proxy":"Go","composer":"Packagist","maven-public":"Maven","nuget-proxy":"NuGet","cargo-proxy":{"ecosystem":"crates.io","upstream":"https://index.crates.io","downloadUpstream":"https://static.crates.io/crates","direct":true},"rubygems-proxy":"RubyGems","ubuntu-2204":{"ecosystem":"Ubuntu:22.04","upstream":"https://archive.ubuntu.com/ubuntu","direct":true},"ubuntu-2404":{"ecosystem":"Ubuntu:24.04","upstream":"https://archive.ubuntu.com/ubuntu","direct":true},"centos-stream9-baseos":{"ecosystem":"CentOS:9","upstream":"https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/os","direct":true},"centos-stream9-appstream":{"ecosystem":"CentOS:9","upstream":"https://mirror.stream.centos.org/9-stream/AppStream/x86_64/os","direct":true},"rhel9-baseos":{"ecosystem":"Red Hat:9"},"rhel9-appstream":{"ecosystem":"Red Hat:9"}}}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/app/.trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
      nexus:
        condition: service_started
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: osvguard-nexus
    networks:
      - osvguard
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 150s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: osvguard-frontend
    networks:
      - osvguard
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trivy-cache:
  postgres-data:
  nexus-data:
